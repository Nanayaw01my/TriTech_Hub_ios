name: Build Lock Agent APK

# Manually triggered from the GitHub "Actions" tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: lock-agent
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      # Each build gets a higher version number, so phones know there's an update.
      - name: Build release APK
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          gradle assembleRelease --no-daemon -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=1.$VERSION_CODE

      # Every build MUST be signed with the same permanent key: phones only
      # accept a self-update signed like the app they already have. A build
      # signed with a throwaway key would strand every phone on the old version.
      - name: Require the permanent signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets (Settings → Secrets and variables → Actions) — the app compiled, but it is not published without the key."
            exit 1
          fi

      - name: Sign with the permanent release key
        run: |
          # Tolerate copy/paste debris (spaces, line breaks, invisible characters,
          # a pasted "Value:" label): keep only the base64 text, and take the
          # 32-character hex password out of whatever was pasted.
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > release.p12
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C grep -oE '[0-9a-f]{32}' | head -n1)
          [ -n "$PASS" ] || PASS="$KEYSTORE_PASSWORD"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks release.p12 --ks-pass pass:"$PASS" \
            --ks-key-alias dandorsolar --key-pass pass:"$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            app/build/outputs/apk/release/app-release.apk
          rm -f release.p12

      - name: Compute provisioning signature checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          SHA_HEX=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/{print $2; exit}')
          CHECKSUM=$(echo "$SHA_HEX" | tr -d ' :' | xxd -r -p | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          echo "AGENT_APK_CHECKSUM = $CHECKSUM"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "$CHECKSUM" > checksum.txt
          {
            echo "## Lock Agent APK built";
            echo "";
            echo "The APK + checksum are committed to backend/downloads/, so the";
            echo "enrollment QR serves from your own domain automatically — no env";
            echo "vars needed. Deploy the backend to pick them up.";
            echo '```';
            echo "signature checksum: $CHECKSUM";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK to GitHub Release (always-on CDN)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp lock-agent/app/build/outputs/apk/release/app-release.apk dandorsolar-lock-agent.apk
          gh release view lock-agent >/dev/null 2>&1 || \
            gh release create lock-agent --title "Dan & Dor Solar Lock Agent" \
              --notes "Latest lock agent APK (auto-published)." --target "$GITHUB_SHA"
          # Upload under the exact filename the QR points at.
          gh release upload lock-agent dandorsolar-lock-agent.apk --clobber
          # Remove the mislabeled asset from the first run, if present.
          gh release delete-asset lock-agent app-release.apk -y || true

      - name: Publish APK to backend/downloads
        working-directory: ${{ github.workspace }}
        run: |
          # Stage this build's files, then commit them on top of the LATEST branch
          # (another build may have published meanwhile). Never let an older build
          # overwrite a newer one.
          OUT="$RUNNER_TEMP/agent-out"; mkdir -p "$OUT"
          cp lock-agent/app/build/outputs/apk/release/app-release.apk "$OUT/dandorsolar-lock-agent.apk"
          printf '%s' "$CHECKSUM" > "$OUT/agent-checksum.txt"
          # For phone self-update: the version number + file hash the phone checks.
          printf '%s' "$VERSION_CODE" > "$OUT/agent-version.txt"
          sha256sum "$OUT/dandorsolar-lock-agent.apk" | cut -d' ' -f1 | tr -d '\n' > "$OUT/agent-apk-sha256.txt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "${{ github.ref_name }}"
            git checkout -q -B publish "origin/${{ github.ref_name }}"
            PUBLISHED=$(cat backend/downloads/agent-version.txt 2>/dev/null || echo 0)
            if [ "${PUBLISHED:-0}" -ge "$VERSION_CODE" ] 2>/dev/null; then
              echo "A newer build ($PUBLISHED) is already published — not overwriting it with $VERSION_CODE."
              exit 0
            fi
            mkdir -p backend/downloads
            cp "$OUT"/* backend/downloads/
            git add -f backend/downloads/dandorsolar-lock-agent.apk backend/downloads/agent-checksum.txt \
              backend/downloads/agent-version.txt backend/downloads/agent-apk-sha256.txt
            git commit -q -m "ci: publish lock-agent APK v$VERSION_CODE to backend/downloads"
            if git push origin HEAD:${{ github.ref_name }}; then break; fi
            echo "Push raced with another commit — retrying ($attempt)"
            sleep 5
          done
          # Move the stable "agent-latest" tag to this commit. The backend's
          # download URL is pinned to this tag (no slash, always-on via raw), so
          # the link and the checksum always come from the SAME build — they can
          # never drift out of sync the way a per-build URL file could.
          SHA=$(git rev-parse HEAD)
          git tag -f agent-latest "$SHA"
          git push -f origin "refs/tags/agent-latest"

      - name: Upload APK + checksum (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dandorsolar-lock-agent
          path: |
            lock-agent/app/build/outputs/apk/release/app-release.apk
            lock-agent/checksum.txt
          if-no-files-found: error
