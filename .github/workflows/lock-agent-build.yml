name: Build Lock Agent APK

# Manually triggered from the GitHub "Actions" tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: lock-agent
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign with release keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true \
            app/build/outputs/apk/release/app-release.apk

      - name: Compute provisioning signature checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          SHA_HEX=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/{print $2; exit}')
          CHECKSUM=$(echo "$SHA_HEX" | tr -d ' :' | xxd -r -p | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          echo "AGENT_APK_CHECKSUM = $CHECKSUM"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "$CHECKSUM" > checksum.txt
          {
            echo "## Lock Agent APK built";
            echo "";
            echo "The APK + checksum are committed to backend/downloads/, so the";
            echo "enrollment QR serves from your own domain automatically — no env";
            echo "vars needed. Deploy the backend to pick them up.";
            echo '```';
            echo "signature checksum: $CHECKSUM";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK to GitHub Release (always-on CDN)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp lock-agent/app/build/outputs/apk/release/app-release.apk dandorsolar-lock-agent.apk
          gh release view lock-agent >/dev/null 2>&1 || \
            gh release create lock-agent --title "Dan Dorsolar Lock Agent" \
              --notes "Latest lock agent APK (auto-published)." --target "$GITHUB_SHA"
          # Upload under the exact filename the QR points at.
          gh release upload lock-agent dandorsolar-lock-agent.apk --clobber
          # Remove the mislabeled asset from the first run, if present.
          gh release delete-asset lock-agent app-release.apk -y || true

      - name: Publish APK to backend/downloads
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p backend/downloads
          cp lock-agent/app/build/outputs/apk/release/app-release.apk backend/downloads/dandorsolar-lock-agent.apk
          printf '%s' "$CHECKSUM" > backend/downloads/agent-checksum.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backend/downloads/dandorsolar-lock-agent.apk backend/downloads/agent-checksum.txt
          if git diff --cached --quiet; then
            echo "No APK changes."
          else
            git commit -m "ci: publish lock-agent APK + checksum to backend/downloads"
            git push origin HEAD:${{ github.ref_name }}
          fi
          # Pin a COMMIT-based raw download URL (no slash) so the provisioning QR
          # has a direct, always-on link. Branch names with a slash (like
          # claude/beautiful-goldberg-OmWU0) break raw.githubusercontent.com URLs.
          SHA=$(git rev-parse HEAD)
          printf 'https://raw.githubusercontent.com/%s/%s/backend/downloads/dandorsolar-lock-agent.apk' "$GITHUB_REPOSITORY" "$SHA" > backend/downloads/agent-apk-url.txt
          git add -f backend/downloads/agent-apk-url.txt
          if git diff --cached --quiet; then
            echo "URL unchanged."
          else
            git commit -m "ci: pin agent APK raw download URL"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload APK + checksum (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dandorsolar-lock-agent
          path: |
            lock-agent/app/build/outputs/apk/release/app-release.apk
            lock-agent/checksum.txt
          if-no-files-found: error
