name: Build Dan & Dor Solar App APK

# Builds the Android app (a Capacitor shell that loads the live site) and
# publishes it to backend/downloads/dandorsolar-app.apk, so it can be downloaded
# from https://dandorsolar.site/downloads/dandorsolar-app.apk after a redeploy.
#
# Signing: every build is signed with the company's permanent key (the same
# KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets as the lock agent), so new
# versions install straight over old ones. APP_KEYSTORE_* secrets, if set,
# override it. There is no temporary-key fallback: a build without a key fails.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
      APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build offline fallback bundle + sync Android
        working-directory: frontend
        run: |
          npm run build:cap
          npx cap sync android

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      - name: Sign APK
        working-directory: frontend/android/app/build/outputs/apk/release
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 app-release-unsigned.apk aligned.apk
          if [ -n "$APP_KEYSTORE_BASE64" ]; then
            echo "$APP_KEYSTORE_BASE64" | base64 -d > app.jks
            KS_PASS="$APP_KEYSTORE_PASSWORD"; ALIAS="$APP_KEY_ALIAS"; KEY_PASS="$APP_KEY_PASSWORD"
            echo "SIGNING=permanent key (APP_KEYSTORE secret)" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            # Company permanent key (same as the lock agent). Tolerate copy/paste
            # debris in the secrets, as the lock-agent build does.
            printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > app.jks
            KS_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C grep -oE '[0-9a-f]{32}' | head -n1)
            [ -n "$KS_PASS" ] || KS_PASS="$KEYSTORE_PASSWORD"
            ALIAS=dandorsolar; KEY_PASS="$KS_PASS"
            echo "SIGNING=permanent company key" >> "$GITHUB_ENV"
          else
            echo "::error::No signing key. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD repo secrets."
            exit 1
          fi
          "$BT/apksigner" sign --ks app.jks --ks-pass pass:"$KS_PASS" \
            --ks-key-alias "$ALIAS" --key-pass pass:"$KEY_PASS" \
            --out dandorsolar-app.apk aligned.apk
          "$BT/apksigner" verify dandorsolar-app.apk
          rm -f app.jks

      - name: Publish APK to backend/downloads
        run: |
          cp frontend/android/app/build/outputs/apk/release/dandorsolar-app.apk backend/downloads/dandorsolar-app.apk
          printf '1.0.%s\n' "${{ github.run_number }}" > backend/downloads/dandorsolar-app-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backend/downloads/dandorsolar-app.apk backend/downloads/dandorsolar-app-version.txt
          git commit -m "ci: publish Dan & Dor Solar app APK 1.0.${{ github.run_number }}"
          # Another build may have pushed meanwhile — replay on top of it.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
          {
            echo "## Dan & Dor Solar app 1.0.${{ github.run_number }} built"
            echo ""
            echo "Signing: $SIGNING"
            echo ""
            echo "Redeploy Render, then download: https://dandorsolar.site/downloads/dandorsolar-app.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dandorsolar-app
          path: backend/downloads/dandorsolar-app.apk
          if-no-files-found: error
