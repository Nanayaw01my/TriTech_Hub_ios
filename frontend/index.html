<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D32" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TriTech Hub" />

    <!-- Startup screen for iOS (requires multiple sizes) -->
    <link rel="apple-touch-startup-image" href="/logo.png" media="screen and (max-device-width: 480px)" />
    <link rel="apple-touch-startup-image" href="/logo.png" media="screen and (device-width: 768px) and (device-height: 1024px)" />

    <!-- App description and keywords -->
    <meta name="description" content="iPhone Installment Management System - Hire Purchase Sales & Device Tracking" />
    <meta name="keywords" content="iPhone, installment, hire-purchase, sales, management" />
    <meta name="author" content="TriTech Hub iOS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- No cache for HTML, cache everything else -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>TriTech Hub iOS</title>
    <link rel="preconnect" href="https://js.paystack.co" crossorigin />
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
