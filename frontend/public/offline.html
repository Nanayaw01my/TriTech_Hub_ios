<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dan &amp; Dor Solar — No connection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px; text-align: center; background: #fff;
      font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif; color: #1f2937;
    }
    .tile {
      width: 88px; height: 88px; border-radius: 22px; display: flex; align-items: center;
      justify-content: center; color: #fff; font-weight: 900; font-size: 36px; letter-spacing: -1px;
      background: linear-gradient(135deg, #F97316, #C2410C);
      box-shadow: 0 10px 30px rgba(234, 88, 12, .25);
    }
    h1 { margin-top: 22px; font-size: 22px; font-weight: 800; }
    .brand { margin-top: 4px; font-size: 12px; font-weight: 700; color: #EA580C; letter-spacing: 2px; text-transform: uppercase; }
    p { margin-top: 16px; font-size: 15px; line-height: 1.5; color: #6b7280; max-width: 300px; }
    button {
      margin-top: 28px; border: 0; border-radius: 14px; padding: 14px 36px; font-size: 16px;
      font-weight: 700; color: #fff; background: #EA580C; cursor: pointer;
    }
    button:active { background: #C2410C; }
  </style>
</head>
<body>
  <div class="tile">DD</div>
  <h1>No internet connection</h1>
  <div class="brand">Dan &amp; Dor Solar</div>
  <p>Check that mobile data or Wi-Fi is on, then try again.</p>
  <button onclick="location.href='https://dandorsolar.site/'">Try again</button>
</body>
</html>
