<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, #1b5e20 0%, #2e7d32 45%, #1a6b26 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .logo-wrap {
      width: 130px;
      height: 130px;
      background: white;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      margin-bottom: 36px;
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .logo-wrap img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }
    h1 {
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 6px;
      animation: slideUp 0.6s 0.25s ease-out both;
    }
    .tagline {
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: slideUp 0.6s 0.35s ease-out both;
    }
    .loader {
      margin-top: 60px;
      display: flex;
      gap: 10px;
      animation: slideUp 0.6s 0.45s ease-out both;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: pulse 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes popIn {
      0%   { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes slideUp {
      0%   { transform: translateY(24px); opacity: 0; }
      100% { transform: translateY(0);    opacity: 1; }
    }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.3; }
      40%            { transform: scale(1);    opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="./appIcon.png" alt="TriTech Hub" />
  </div>
  <h1>TriTech Hub</h1>
  <p class="tagline">iPhone Installment Management</p>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
