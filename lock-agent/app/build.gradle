plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dandorsolar.lockagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.dandorsolar.lockagent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Firebase Cloud Messaging config (optional). Supplied as Gradle
        // properties at build time (e.g. from CI secrets). Blank => FCM off,
        // agent stays poll-only and the build still works.
        buildConfigField "String", "FIREBASE_APP_ID", "\"${project.findProperty('FIREBASE_APP_ID') ?: ''}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${project.findProperty('FIREBASE_API_KEY') ?: ''}\""
        buildConfigField "String", "FIREBASE_SENDER_ID", "\"${project.findProperty('FIREBASE_SENDER_ID') ?: ''}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${project.findProperty('FIREBASE_PROJECT_ID') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI replaces this with the real release signing config. Locally it
            // falls back to the debug keystore so the project always assembles.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // The provisioning activities reference API 29+ constants but only run on
        // API 29+ devices; runtime-guarded API calls are checked by hand.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Firebase Cloud Messaging (initialized programmatically — no
    // google-services plugin or google-services.json required).
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
