plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dandorsolar.lockagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.dandorsolar.lockagent"
        minSdk 26
        targetSdk 34
        // CI passes -PVERSION_CODE (rises every build) so phones can self-update.
        versionCode((project.findProperty('VERSION_CODE') ?: '1') as Integer)
        versionName((project.findProperty('VERSION_NAME') ?: '1.0') as String)

        // Firebase Cloud Messaging (instant lock/unlock), project
        // "dan-and-dor-solar". These are the public client values from
        // google-services.json (safe to ship in the app); initialized in code
        // (Fcm.kt), so no google-services plugin is needed. Overridable with
        // -PFIREBASE_* Gradle properties; blank => FCM off, 15-min poll only.
        buildConfigField "String", "FIREBASE_APP_ID", "\"${project.findProperty('FIREBASE_APP_ID') ?: '1:4156809907:android:a59d226eb7f12dc10306c6'}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${project.findProperty('FIREBASE_API_KEY') ?: 'AIzaSyAx-zWwbrK0k3i3YIM9EdQlmhg2-OD1ChU'}\""
        buildConfigField "String", "FIREBASE_SENDER_ID", "\"${project.findProperty('FIREBASE_SENDER_ID') ?: '4156809907'}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${project.findProperty('FIREBASE_PROJECT_ID') ?: 'dan-and-dor-solar'}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        // Force v1 (JAR) signing ON in addition to v2/v3. AGP turns v1 off for
        // minSdk >= 24, but many devices' Device Owner QR provisioning validate
        // the v1 signature and report "missing components or corrupted" without
        // it. Keeping v1 makes enrollment work across Samsung/Tecno/Infinix.
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI replaces this with the real release signing config. Locally it
            // falls back to the debug keystore so the project always assembles.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // The provisioning activities reference API 29+ constants but only run on
        // API 29+ devices; runtime-guarded API calls are checked by hand.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Firebase Cloud Messaging — instant lock/unlock/release pushes.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
